<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, initial-scale=1.0">
<title>WZ 配置弹窗原型</title>
<style>
/* ── Theme Variables ── */
:root {
  --bg-body: radial-gradient(ellipse at 20% 30%,#1f2335 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,#1a1e30 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,#151824 0%,transparent 60%),linear-gradient(135deg,#0d0f16 0%,#141822 40%,#181c2a 70%,#0d0f16 100%);
  --win-bg: rgba(30,30,38,.88);
  --win-brd: rgba(80,80,90,.6);
  --win-shdw: 0 4px 32px rgba(0,0,0,.5);
  --txt-pri: #f0f0f4;
  --txt-sec: #a0a0b0;
  --txt-dim: #707080;
  --txt-mute: rgba(255,255,255,.15);
  --nt-bg: rgba(28,28,36,.6);
  --nt-brd: rgba(120,120,140,.3);
  --nt-act: #5E9CFF;
  --pt-act: rgba(94,156,255,.15);
  --input-bg: rgba(30,30,36,.7);
  --input-brd: rgba(120,120,140,.3);
  --input-brd-focus: #5E9CFF;
  --btn-sc-bg: rgba(60,60,70,.5);
  --btn-sc-hov: rgba(94,156,255,.15);
  --btn-pr: #5E9CFF;
  --btn-pr-hov: #7BB4FF;
}

*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-body);font-family:-apple-system,"SF Pro","SF Pro Display","Helvetica Neue",sans-serif;color:var(--txt-pri);-webkit-font-smoothing:antialiased;user-select:none}

/* ── Overlay ── */
.overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center}

/* ── WZ Config Modal ── */
.wz-win{width:500px;height:280px;background:rgba(38,38,44,.9);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border-radius:12px;border:1px solid rgba(80,80,90,.6);box-shadow:0 8px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}

/* ── Title Bar ── */
.wz-tb{display:flex;align-items:center;height:38px;padding:0 12px;border-bottom:1px solid rgba(80,80,90,.6);flex-shrink:0}
.wz-dots{display:flex;gap:7px;margin-right:12px}
.wz-d{width:12px;height:12px;border-radius:50%;cursor:pointer}
.wz-d.r{background:#FF5F56}.wz-d.y{background:#FEBC2E}.wz-d.g{background:#28C840}
.wz-tt{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--txt-sec);letter-spacing:.3px}

/* ── Body ── */
.wz-body{flex:1;display:flex;flex-direction:column;padding:20px 24px;gap:16px;justify-content:center}

/* ── Field Row ── */
.wz-row{display:flex;flex-direction:column;gap:5px}
.wz-row label{font-size:11px;font-weight:500;color:var(--txt-sec);letter-spacing:.2px}
.wz-row .wz-hint{font-size:9px;color:var(--txt-dim);margin-left:auto;font-weight:400}
.wz-row .wz-lbl{display:flex;align-items:center}
.wz-input-wrap{display:flex;align-items:center;gap:8px}
.wz-input-wrap input{flex:1;height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--input-brd);background:var(--input-bg);color:var(--txt-pri);font-size:12px;outline:none;font-family:inherit;transition:border-color .2s}
.wz-input-wrap input::placeholder{color:var(--txt-dim)}
.wz-input-wrap input:focus{border-color:var(--input-brd-focus);box-shadow:0 0 0 2px rgba(94,156,255,0.2)}
.wz-browse{height:28px;padding:0 10px;border-radius:5px;border:1px solid var(--nt-brd);background:var(--btn-sc-bg);color:var(--txt-sec);font-size:10px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap;flex-shrink:0}
.wz-browse:hover{background:rgba(94,156,255,.12);color:var(--nt-act);border-color:rgba(94,156,255,.2)}

/* ── Actions ── */
.wz-actions{display:flex;gap:8px;margin-top:4px;justify-content:flex-end}
.wz-btn{height:30px;padding:0 20px;border-radius:6px;border:none;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .12s}
.wz-btn.sc{background:var(--btn-sc-bg);color:var(--txt-sec);border:1px solid var(--nt-brd)}
.wz-btn.sc:hover{background:rgba(94,156,255,.1);color:var(--nt-act);border-color:rgba(94,156,255,.2)}
.wz-btn.pr{background:var(--btn-pr);color:#fff;border:1px solid transparent}
.wz-btn.pr:hover{background:var(--btn-pr-hov)}

/* ── Status Bar ── */
.wz-status{height:28px;border-top:1px solid rgba(80,80,90,.4);display:flex;align-items:center;padding:0 14px;font-size:9px;color:var(--txt-dim);flex-shrink:0;gap:6px}
.wz-status .wz-dot{width:5px;height:5px;border-radius:50%;background:#34C759;flex-shrink:0}
.wz-status .wz-dot.idle{background:var(--txt-dim)}
</style>
</head>
<body>

<div class="overlay">
  <div class="wz-win">
    <!-- Title Bar -->
    <div class="wz-tb">
      <div class="wz-dots"><div class="wz-d r"></div><div class="wz-d y"></div><div class="wz-d g"></div></div>
      <div class="wz-tt">📦 WZ 配置</div>
    </div>

    <!-- Body -->
    <div class="wz-body">
      <!-- wzlib 路径 -->
      <div class="wz-row">
        <div class="wz-lbl">
          <label for="wzlibPath">wzlib 路径</label>
          <span class="wz-hint">WzComparerR2.WzLib.dll</span>
        </div>
        <div class="wz-input-wrap">
          <input type="text" id="wzlibPath" value="C:\R2\WzComparerR2.WzLib.dll" placeholder="选择 wzlib DLL 文件…">
          <button class="wz-browse" onclick="toast('📂 浏览 wzlib…')">浏览…</button>
        </div>
      </div>

      <!-- BaseWZ 路径 -->
      <div class="wz-row">
        <div class="wz-lbl">
          <label for="baseWzPath">BaseWZ 路径</label>
          <span class="wz-hint">冒险岛客户端 Data 目录</span>
        </div>
        <div class="wz-input-wrap">
          <input type="text" id="baseWzPath" value="C:\MapleStory\Data" placeholder="选择 Data 目录…">
          <button class="wz-browse" onclick="toast('📂 浏览 BaseWZ…')">浏览…</button>
        </div>
      </div>

      <!-- Actions -->
      <div class="wz-actions">
        <button class="wz-btn sc" onclick="toast('验证中…')">验证</button>
        <span style="flex:1"></span>
        <button class="wz-btn sc" onclick="toast('❌ 已取消')">取消</button>
        <button class="wz-btn pr" onclick="toast('✅ 配置已保存')">保存</button>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="wz-status">
      <span class="wz-dot"></span>
      <span>wzlib 已加载 · BaseWZ 就绪</span>
      <span style="margin-left:auto;font-family:'SF Mono',monospace;font-size:8px;color:var(--txt-mute)">v0.1</span>
    </div>
  </div>
</div>

<script>
function toast(msg){
  const o=document.querySelector('.ttt');if(o)o.remove();
  const t=document.createElement('div');
  t.className='ttt';
  Object.assign(t.style,{position:'fixed',bottom:'20px',left:'50%',transform:'translateX(-50%)',background:'rgba(30,30,40,.95)',color:'var(--txt-pri)',padding:'6px 16px',borderRadius:'6px',fontSize:'11px',backdropFilter:'blur(12px)',border:'1px solid var(--nt-brd)',zIndex:'99999',animation:'ti .2s',fontFamily:"-apple-system,'SF Pro',sans-serif"});
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}
</script>
<style>
@keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</body>
</html>
