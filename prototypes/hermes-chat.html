<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1020, initial-scale=1.0">
<title>💬 Hermes Chat — 对话窗口原型</title>
<style>
/* ── Theme Variables (macOS 暗色毛玻璃) ── */
:root {
  --bg-body: radial-gradient(ellipse at 20% 30%,#1f2335 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,#1a1e30 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,#151824 0%,transparent 60%),linear-gradient(135deg,#0d0f16 0%,#141822 40%,#181c2a 70%,#0d0f16 100%);
  --win-bg: rgba(30,30,38,.88);
  --win-brd: rgba(80,80,90,.6);
  --win-shdw: 0 4px 32px rgba(0,0,0,.5);
  --txt-pri: #f0f0f4;
  --txt-sec: #a0a0b0;
  --txt-dim: #707080;
  --txt-mute: rgba(255,255,255,.15);
  --nt-bg: rgba(28,28,36,.6);
  --nt-brd: rgba(120,120,140,.3);
  --nt-act: #5E9CFF;
  --pt-act: rgba(94,156,255,.15);
  --input-bg: rgba(30,30,36,.7);
  --input-brd: rgba(120,120,140,.3);
  --input-brd-focus: #5E9CFF;
  --btn-pr: #5E9CFF;
  --btn-pr-hov: #7BB4FF;
  --msg-user: #5E9CFF;
  --msg-ai: rgba(255,255,255,.07);
}

*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-body);font-family:-apple-system,"SF Pro","SF Pro Display","Helvetica Neue",sans-serif;color:var(--txt-pri);-webkit-font-smoothing:antialiased;user-select:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--nt-brd);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}

/* ── Floating Window ── */
.win{
  width:400px;height:500px;
  background:var(--win-bg);
  backdrop-filter:blur(48px) saturate(140%);
  -webkit-backdrop-filter:blur(48px) saturate(140%);
  border-radius:14px;
  border:1px solid var(--win-brd);
  box-shadow:var(--win-shdw);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}

/* ── Title Bar ── */
.tb{
  display:flex;
  align-items:center;
  height:44px;
  padding:0 14px;
  border-bottom:1px solid var(--nt-brd);
  flex-shrink:0;
  gap:10px;
}
.dts{display:flex;gap:7px}
.dt{width:11px;height:11px;border-radius:50%}
.dt.r{background:#FF5F57}
.dt.y{background:#FEBC2E}
.dt.g{background:#28C840}
.tt{font-size:13px;font-weight:600;letter-spacing:.3px;color:var(--txt-pri);flex:1}
.ts{font-size:10px;color:var(--txt-dim);font-weight:400}

/* ── Connection Status ── */
.status{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:10px;
  color:var(--txt-dim);
  flex-shrink:0;
  padding:0 14px;
  height:28px;
  border-bottom:1px solid var(--nt-brd);
}
.status .dot{
  width:7px;height:7px;
  border-radius:50%;
  flex-shrink:0;
}
.status .dot.green{background:#34C759;box-shadow:0 0 6px rgba(52,199,89,.5)}
.status .dot.red{background:#FF453A;box-shadow:0 0 6px rgba(255,69,58,.4)}
.status .lbl{flex:1}
.status .id{font-size:9px;color:var(--txt-mute);font-family:"SF Mono",monospace}

/* ── Messages ── */
.msgs{
  flex:1;
  overflow-y:auto;
  padding:10px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.msgs .empty{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--txt-mute);
  font-size:12px;
  flex-direction:column;
  gap:6px;
}
.msgs .empty .ic{font-size:28px;opacity:.4}

.msg{
  max-width:88%;
  animation:mi .25s ease-out;
}
.msg.u{align-self:flex-end}
.msg.p{align-self:flex-start}

.msg .bubble{
  padding:8px 12px;
  border-radius:12px;
  font-size:12px;
  line-height:1.55;
  word-break:break-word;
  position:relative;
}
.msg.u .bubble{
  background:var(--msg-user);
  color:#fff;
  border-bottom-right-radius:3px;
}
.msg.p .bubble{
  background:var(--msg-ai);
  color:var(--txt-pri);
  border:1px solid rgba(255,255,255,.06);
  border-bottom-left-radius:3px;
}

.msg .meta{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:4px;
  font-size:9px;
}
.msg.u .meta{justify-content:flex-end}
.msg.p .meta{justify-content:flex-start}

.msg .avatar{
  width:18px;height:18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  flex-shrink:0;
}
.msg.u .avatar{background:rgba(255,255,255,.2)}
.msg.p .avatar{background:rgba(94,156,255,.25);color:var(--nt-act)}

.msg .time{
  color:var(--txt-dim);
  font-family:"SF Mono",monospace;
}

.msg .name{
  font-weight:500;
  color:var(--txt-sec);
}

/* ── Typing Indicator ── */
.typing{
  align-self:flex-start;
  display:flex;
  gap:3px;
  padding:9px 14px;
  background:var(--msg-ai);
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;
  border-bottom-left-radius:3px;
  margin-top:-2px;
}
.typing span{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--txt-mute);
  animation:bn 1.4s infinite;
}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}

/* ── Input Area ── */
.inp{
  display:flex;
  align-items:center;
  padding:8px 12px 10px;
  gap:6px;
  border-top:1px solid var(--nt-brd);
  background:rgba(0,0,0,.12);
  flex-shrink:0;
}
.inp input{
  flex:1;
  background:var(--input-bg);
  border:1px solid var(--input-brd);
  border-radius:18px;
  padding:7px 14px;
  font-size:12px;
  color:var(--txt-pri);
  outline:none;
  font-family:inherit;
}
.inp input::placeholder{color:var(--txt-dim)}
.inp input:focus{
  border-color:var(--input-brd-focus);
  box-shadow:0 0 0 2px rgba(94,156,255,.15);
}
.inp .sb{
  width:32px;height:32px;
  border-radius:50%;
  border:none;
  background:var(--btn-pr);
  color:#fff;
  font-size:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.15s;
  flex-shrink:0;
}
.inp .sb:hover{background:var(--btn-pr-hov);transform:scale(1.05)}
.inp .sb:active{transform:scale(.95)}

/* ── Quick Reply Chips ── */
.qr{
  display:flex;
  gap:4px;
  padding:0 12px 6px;
  flex-wrap:wrap;
  flex-shrink:0;
}
.qb{
  font-size:10px;
  padding:3px 10px;
  border-radius:10px;
  border:1px solid var(--nt-brd);
  background:rgba(255,255,255,.02);
  color:var(--txt-dim);
  cursor:pointer;
  transition:.15s;
  white-space:nowrap;
}
.qb:hover{
  background:var(--pt-act);
  border-color:rgba(94,156,255,.25);
  color:var(--nt-act);
}

/* ── Keyframes ── */
@keyframes mi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes bn{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
</style>
</head>
<body>

<div class="win" id="app">
  <!-- Title Bar -->
  <div class="tb">
    <div class="dts">
      <div class="dt r"></div>
      <div class="dt y"></div>
      <div class="dt g"></div>
    </div>
    <div class="tt">💬 Hermes Chat</div>
    <div class="ts">v2.5</div>
  </div>

  <!-- Connection Status -->
  <div class="status" id="statusBar">
    <span class="dot green" id="statusDot"></span>
    <span class="lbl" id="statusLabel">已连接 · Hermes Agent</span>
    <span class="id">ws:active</span>
  </div>

  <!-- Messages -->
  <div class="msgs" id="msgList">
    <div class="empty" id="emptyHint">
      <div class="ic">💬</div>
      <div>开始与 Hermes 对话</div>
    </div>
  </div>

  <!-- Quick Replies -->
  <div class="qr" id="quickReplies">
    <div class="qb" data-msg="查看当前状态">📊 状态</div>
    <div class="qb" data-msg="有哪些技能可用">🛠️ 技能</div>
    <div class="qb" data-msg="帮我写个 Shell 脚本">📝 脚本</div>
    <div class="qb" data-msg="解释 Hermes 架构">🏗️ 架构</div>
  </div>

  <!-- Input -->
  <div class="inp">
    <input type="text" id="chatInput" placeholder="输入消息…" autofocus>
    <button class="sb" id="sendBtn">➤</button>
  </div>
</div>

<script>
(function() {
  const $ = id => document.getElementById(id);
  const msgList = $('msgList');
  const emptyHint = $('emptyHint');
  const chatInput = $('chatInput');
  const sendBtn = $('sendBtn');
  const statusDot = $('statusDot');
  const statusLabel = $('statusLabel');

  let connected = true;
  let msgCount = 0;

  /* ── Toggle Connection ── */
  function setConnected(ok) {
    connected = ok;
    statusDot.className = 'dot ' + (ok ? 'green' : 'red');
    statusLabel.textContent = ok ? '已连接 · Hermes Agent' : '已断开 · 等待重连…';
  }

  /* ── Add Message ── */
  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'u' : 'p');

    const now = new Date();
    const ts = now.getHours().toString().padStart(2,'0') + ':' +
               now.getMinutes().toString().padStart(2,'0');

    if (role === 'user') {
      div.innerHTML =
        '<div class="bubble">' + escapeHtml(text) + '</div>' +
        '<div class="meta">' +
          '<span class="time">' + ts + '</span>' +
          '<span class="name">你</span>' +
          '<span class="avatar">👤</span>' +
        '</div>';
    } else {
      div.innerHTML =
        '<div class="bubble">' + escapeHtml(text) + '</div>' +
        '<div class="meta">' +
          '<span class="avatar">🤖</span>' +
          '<span class="name">Hermes</span>' +
          '<span class="time">' + ts + '</span>' +
        '</div>';
    }

    emptyHint.style.display = 'none';
    msgList.appendChild(div);
    msgList.scrollTop = msgList.scrollHeight;
    msgCount++;
  }

  /* ── Show Typing ── */
  function showTyping() {
    const el = document.createElement('div');
    el.className = 'typing';
    el.id = 'typingInd';
    el.innerHTML = '<span></span><span></span><span></span>';
    emptyHint.style.display = 'none';
    msgList.appendChild(el);
    msgList.scrollTop = msgList.scrollHeight;
  }

  function hideTyping() {
    const el = $('typingInd');
    if (el) el.remove();
  }

  /* ── Simulate AI Reply ── */
  const replies = [
    '好的，已收到你的请求。正在处理中…',
    '这是 Hermes 的响应示例。你可以在此查看 AI 的回复内容，包括代码片段和 Markdown 渲染。',
    '连接状态指示器显示当前 WebSocket 连接状况。',
    'Hermes 当前可用技能：代码审查、文件搜索、终端执行、Git 操作、浏览器自动化等。',
    '已执行：`ls -la ~/IdeaProjects/`，返回 12 个结果。'
  ];

  function simulateReply(userText) {
    showTyping();
    const reply = replies[Math.floor(Math.random() * replies.length)];
    setTimeout(() => {
      hideTyping();
      addMessage(reply, 'ai');
    }, 800 + Math.random() * 600);
  }

  /* ── Send Message ── */
  function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;
    if (!connected) {
      setConnected(true);
      addMessage('🔄 重新连接成功', 'ai');
    }
    addMessage(text, 'user');
    chatInput.value = '';
    simulateReply(text);
  }

  /* ── Escape HTML ── */
  function escapeHtml(str) {
    const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
    return str.replace(/[&<>"']/g, c => map[c]);
  }

  /* ── Events ── */
  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  /* ── Quick Reply Chips ── */
  document.querySelectorAll('.qb').forEach(el => {
    el.addEventListener('click', () => {
      chatInput.value = el.getAttribute('data-msg');
      sendMessage();
    });
  });

  /* ── Toggle Connection on status bar click (demo) ── */
  $('statusBar').addEventListener('click', () => {
    setConnected(!connected);
    if (!connected) {
      addMessage('⚠️ 连接已断开，点击状态栏可重新连接', 'ai');
    }
  });

  /* ── Initial Greeting ── */
  setTimeout(() => {
    addMessage('你好！我是 Hermes，你的 AI 助手。有什么可以帮助你的？', 'ai');
  }, 400);

})();
</script>
</body>
</html>
